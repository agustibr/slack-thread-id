<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLACK_THREAD_ID: Formatter</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        input, button { margin: 10px; padding: 10px; }
        #output { margin-top: 20px; font-size: 1.2rem; font-weight: bold; font-family: monospace; }
        #warning { margin-top: 10px; color: #d23800; padding: 1rem; font-weight: normal; }
    </style>
</head>
<body>
    <h2>SLACK_THREAD_ID: Formatter</h2>
    <input type="text" id="urlInput" placeholder="Enter URL here" size="52">
    <button onclick="formatUrl()">Format</button>
    <div id="output"></div>
    <div id="warning"></div>

    <script>
        function formatUrl() {
            const input = document.getElementById("urlInput").value;
            const regex = /archives\/(\w+)\/(p\d{16})/;
            const match = input.match(regex);
            const warningEl = document.getElementById("warning");
            
            if (match) {
                const channelId = match[1];
                const threadId = match[2].slice(0, 10);
                const messageId = match[2].slice(10);
                const formatted = `${channelId}:${threadId}.${messageId}`;
                document.getElementById("output").innerText = formatted;

                if (messageId.startsWith("0")) {
                    warningEl.innerText = "⚠️ Oops! This message ID starts with 0 and won’t trigger a Slack notification.";
                } else {
                    warningEl.innerText = "";
                }
            } else {
                warningEl.innerText = "⚠️ Invalid URL format.";
            }
        }
    </script>
</body>
</html>
